<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡眠銀行 | 通帳</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        /* 窓口と同じカーテンを、低くしたもの（.mini はデモボタンと名前がかぶるので使わない） */
        .stage.stage-small {
            height: 110px;
        }

        .back {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 2;
            text-decoration: none;
        }

        .sign small {
            font-size: 0.85rem;
            margin-left: 6px;
        }

        /* 通帳の中身は「今寝ると」の箱と同じ色・わく */
        .book-card {
            padding: 6px 10px;
            background: var(--card);
            box-shadow: 0 0 0 3px var(--ink);
        }

        .book {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .book th {
            color: var(--sub);
            font-weight: normal;
            text-align: right;
            padding: 8px 4px 6px;
            border-bottom: 2px solid var(--sub);
        }

        .book td {
            padding: 8px 4px;
            text-align: right;
            border-bottom: 2px dotted #3a4596;
            white-space: nowrap;
        }

        .book tr:last-child td {
            border-bottom: none;
        }

        .book th:nth-child(-n+2),
        .book td:nth-child(-n+2) {
            text-align: left;
        }

        .out {
            color: var(--red);
        }

        .in {
            color: var(--green);
        }

        .stamp {
            display: inline-block;
            margin-left: 4px;
            border: 2px solid var(--red);
            color: var(--red);
            border-radius: 50%;
            padding: 1px 5px;
            transform: rotate(-12deg);
            font-size: 0.75rem;
        }

        .empty {
            color: var(--sub);
            text-align: center;
            padding: 16px 0;
        }
    </style>
</head>

<body class="is-night">
    <main class="app">
        <!-- 1. 看板（窓口と同じカーテン） -->
        <section class="panel stage stage-small" aria-label="通帳">
            <a class="chip chip-button back" href="index.html">← 窓口</a>
            <p class="sign">睡眠銀行<small>通帳</small></p>
        </section>

        <!-- 2. 通帳 -->
        <section class="panel">
            <div class="book-card">
                <table class="book">
                    <thead>
                        <tr>
                            <th>年月日</th>
                            <th>摘要</th>
                            <th>お借入れ</th>
                            <th>ご返済</th>
                            <th>差引残高</th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
                <p class="empty" id="empty" hidden>まだ記帳がありません</p>
            </div>
        </section>

        <!-- 3. ひつじのひとこと（窓口と同じセリフ枠） -->
        <section class="panel dialog" aria-label="ひつじのセリフ">
            <span class="name">ひつじ</span>
            <span class="line" id="line"></span>
        </section>
    </main>

    <script src="bank.js"></script>
    <script>
        const hour = now().getHours();
        const isMorning = hour >= 5 && hour < 17;
        document.body.classList.toggle("is-morning", isMorning);
        document.body.classList.toggle("is-night", !isMorning);

        const rows = getPassbook().rows;
        document.getElementById("empty").hidden = rows.length > 0;

        document.getElementById("rows").innerHTML = rows.map(row =>
            `<tr>
                <td>${row.date.slice(5)}</td>
                <td>${row.memo}</td>
                <td class="out">${row.borrow > 0 ? row.borrow : ""}</td>
                <td class="in">${row.repay > 0 ? row.repay : ""}    </td>
                <td>${row.balance}${row.paidOff ? '<span class="stamp">完済</span>' : ""}</td>
             </tr>`
        ).join("");

        const last = rows[rows.length - 1];      // 最後の行（なければ undefined）
        let line;
        if (!last) {
            line = "おやすみを押すと、ここに記帳されるよ";
        } else if (last.balance === 0) {
            line = "借金なし！ちゃんと寝てえらい";
        } else {
            line = `いまの借金は ${last.balance} コイン。利息に気をつけてね…`;
        }
        document.getElementById("line").textContent = line;

    </script>
</body>

</html>
