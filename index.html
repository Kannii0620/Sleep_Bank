<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>睡眠銀行</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>睡眠銀行</h1>
    </header>
    <main>
        <div id="home-screen" hidden>
            <section aria-labelledby="coin-heading">
                <h2 id="coin-heading" tabindex="-1">現在のコイン数</h2>
                <!-- 仮の数値です。計算処理との接続は後から行います。 -->
                <p><span id="coin-count">0</span> コイン</p>
            </section>
            <section aria-labelledby="character-heading">
                <h2 id="character-heading">窓口キャラクター</h2>
                <!-- キャラクターの画像ができたら、この枠を画像に置き換えます。 -->
                <p class="character-placeholder">キャラクター準備中</p>
                <!-- 計算処理につなぐまでは、数値を表示しません。 -->
                <p>今回の利息：<span id="interest-result">未計算</span></p>
                <p class="character-message" id="character-message">今日も睡眠銀行へようこそ。ゆっくり休んでね。</p>
            </section>
        </div>

        <section id="sleeping-screen" aria-labelledby="sleeping-heading">
            <h2 id="sleeping-heading" tabindex="-1">睡眠中</h2>
            <p>おやすみなさい。ゆっくり休んでください。</p>
            <button id="wake-up" type="button">起きた</button>
        </section>

        <section id="morning-screen" aria-labelledby="morning-heading" hidden>
            <h2 id="morning-heading" tabindex="-1">おはようございます</h2>
            <p>昨夜はよく眠れましたか？</p>
            <button id="show-result" type="button">結果を見る</button>
        </section>

        <section id="result-screen" aria-labelledby="result-heading" hidden>
            <h2 id="result-heading" tabindex="-1">今回の睡眠結果</h2>
            <h4>睡眠時間</h4>
            <p id="sleep-duration">未計算</p>
            <h4>現在の借金</h4>
            <p id="current-debt">未計算</p>
            <h4>増減</h4>
            <p>前日と比べて <span id="change-result">未計算</span> 増減</p>
            <button id="back-home" type="button">ホームに戻る</button>
        </section>
    </main>
    <script src="bank.js"></script>
    <script src="morning.js"></script>
</body>
</html>
